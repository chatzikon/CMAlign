services:

  api:

    build: .

    image: cmalign-api:qwen3

    container_name: cmalign-qwen3

    ports:
      - "8001:8001"

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

    environment:

      HF_TOKEN: ${HF_TOKEN}

      HF_HOME: /hf-cache

      WAN_VAE_PATH: /app/checkpoints/Wan2.1_VAE.pth

      SHOWO_STAGE2_CHECKPOINT: /app/checkpoints/showo2_qwen3_stage2.pt

      FUSION_ALPHA: ${FUSION_ALPHA}

    volumes:

      - ./checkpoints:/app/checkpoints:ro

      - ./hf-cache:/hf-cache

    restart: unless-stopped


